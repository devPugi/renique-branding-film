<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>르니크 브랜딩 영상</title>
<meta name="description" content="르니크 브랜딩 영상 기획안 및 스토리보드">
<link rel="icon" href="assets/logo/renique_monogram_espresso.svg" type="image/svg+xml">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 홈페이지 매체 → 에스프레소 바탕 (에스프레소 60 · 화이트 30 · 오렌지 10) */
:root{--esp:#28211D;--esp900:#1E1916;--esp700:#352C26;--linedk:#4C413A;--taupe:#A39A92;--cream:#F5EBE0;--orange:#E86E26;--deep:#CC4A08;
  --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--serif-en:'Cormorant Garamond',Georgia,serif;--serif-kr:'MaruBuri','Noto Serif KR',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--esp);color:var(--cream);font-family:var(--sans);min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;word-break:keep-all}
main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:72px 40px 48px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--orange);text-transform:uppercase}
.logo{display:block;width:clamp(260px,56vw,520px);height:auto;margin-top:28px}
.sub{font-family:var(--serif-en);font-style:italic;color:var(--cream);font-size:clamp(17px,2.2vw,22px);margin-top:24px}
.sub b{font-family:var(--serif-kr);font-style:normal;font-weight:400}
.cats{margin-top:14px;font-family:var(--serif-en);font-size:15px;letter-spacing:.14em;color:var(--taupe)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:48px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--esp700);border:1px solid var(--linedk);overflow:hidden;transition:transform .25s,border-color .25s}
a.card:hover{transform:translateY(-3px);border-color:var(--orange)}
.card .img{aspect-ratio:16/9;background-size:cover;background-position:center}
.card .img.field{background:var(--orange);display:flex;align-items:center;justify-content:center}
.card .img.field img{width:46%;height:auto}
.card .body{padding:22px 24px 24px}
.card .k{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--orange)}
.card h2{font-family:var(--serif-kr);font-weight:400;font-size:22px;margin:6px 0 6px;color:var(--cream)}
.card p{font-size:14px;color:var(--taupe);line-height:1.6}
.card .go{margin-top:14px;font-size:13px;color:var(--cream);font-weight:600}
footer{text-align:center;padding:28px 16px;font-size:12px;letter-spacing:.06em;color:var(--taupe);background:var(--esp900)}
@media(max-width:640px){main{padding:48px 16px 32px}.cards{grid-template-columns:1fr;gap:16px;margin-top:36px}.card .body{padding:18px}.cats{font-size:13px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Branding Film Proposal</div>
  <img class="logo" src="assets/logo/renique_signature_white.svg" alt="RE;NIQUE CLINIC" width="1186" height="345">
  <div class="sub">Renouveau Unique — <b>다시, 나다운 특별함으로.</b></div>
  <div class="cats">LIGNE · VELOUTÉ · ÉCLAT · PURETÉ</div>
  <div class="cards">
    <a class="card" href="르니크한의원_브랜딩영상_기획안.html">
      <div class="img field"><img src="assets/logo/renique_signature_white.svg" alt=""></div>
      <div class="body"><div class="k">01 · PLANNING</div><h2>브랜딩 영상 기획안</h2><p>제안 개요, 브랜드 이해, 크리에이티브 콘셉트, 영상 구성, 제작 계획과 추진 일정</p><div class="go">기획안 보기 →</div></div>
    </a>
    <a class="card" href="르니크한의원_브랜딩영상_스토리보드.html">
      <div class="img" style="background-image:url('스토리보드%20사진/MAIN_CUT_02_16x9.jpg')"></div>
      <div class="body"><div class="k">02 · STORYBOARD</div><h2>브랜딩 영상 스토리보드</h2><p>메인 필름 60″ 15컷, 카테고리 숏폼 15″ × 4, 컷다운·루프 편집 구성</p><div class="go">스토리보드 보기 →</div></div>
    </a>
  </div>
</main>
<footer>르니크 강남 · RE;NIQUE CLINIC</footer>
</body>
</html>
