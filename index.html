<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>르니크 브랜딩 영상</title>
<meta name="description" content="르니크한의원 브랜딩 영상 기획안 및 스토리보드">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Sans+KR:wght@300;400;500&family=Noto+Serif+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f9f3e9;--sand:#efe3d3;--line:#ded2c8;--taupe:#8d7564;--brown:#574438;--ink:#27211d;--accent:#bc4819}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(180deg,var(--ivory),var(--sand));color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-weight:300;min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:72px 40px 48px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:12px;letter-spacing:.2em;color:var(--taupe);text-transform:uppercase}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(60px,12vw,132px);letter-spacing:.04em;line-height:1;margin-top:20px}
h1 span{color:var(--accent)}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--brown);font-size:clamp(17px,2.2vw,22px);margin-top:10px}
.sub b{font-family:'Noto Serif KR',serif;font-style:normal;font-weight:400}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:56px}
a.card{display:block;text-decoration:none;color:inherit;background:#fffaf3;border:1px solid var(--line);overflow:hidden;transition:transform .25s,box-shadow .25s}
a.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(87,68,56,.12)}
.card .img{aspect-ratio:16/9;background-size:cover;background-position:center}
.card .body{padding:22px 24px 24px}
.card .k{font-family:'Cormorant Garamond',serif;font-size:14px;letter-spacing:.18em;color:var(--accent)}
.card h2{font-family:'Noto Serif KR',serif;font-weight:400;font-size:22px;margin:4px 0 6px}
.card p{font-size:14px;color:var(--brown);line-height:1.6}
.card .go{margin-top:14px;font-size:13px;color:var(--ink);font-weight:500}
footer{text-align:center;padding:28px 16px;font-family:'Cormorant Garamond',serif;letter-spacing:.2em;font-size:13px;color:var(--taupe)}
footer span{color:var(--accent)}
@media(max-width:640px){main{padding:48px 16px 32px}.cards{grid-template-columns:1fr;gap:16px;margin-top:40px}.card .body{padding:18px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Branding Film · 2026.11</div>
  <h1>RE<span>;</span>NIQUE</h1>
  <div class="sub">Renouveau Unique — <b>다시, 나다운 특별함으로.</b></div>
  <div class="cards">
    <a class="card" href="르니크한의원_브랜딩영상_기획안.html">
      <div class="img" style="background-image:url('스토리보드%20사진/MAIN_CUT_06_16x9.jpg')"></div>
      <div class="body"><div class="k">01 · PLANNING</div><h2>브랜딩 영상 기획안</h2><p>확정 사항 반영, 크리에이티브 콘셉트, 영상 구성, 톤앤매너, 제작 라인업과 일정</p><div class="go">기획안 보기 →</div></div>
    </a>
    <a class="card" href="르니크한의원_브랜딩영상_스토리보드.html">
      <div class="img" style="background-image:url('스토리보드%20사진/MAIN_CUT_01_16x9.jpg')"></div>
      <div class="body"><div class="k">02 · STORYBOARD</div><h2>브랜딩 영상 스토리보드</h2><p>메인 필름 60″ 14컷, 카테고리 숏폼 15″ × 3, 컷다운·루프 편집 구성</p><div class="go">스토리보드 보기 →</div></div>
    </a>
  </div>
</main>
<footer>RE<span>;</span>NIQUE CLINIC · 르니크한의원</footer>
</body>
</html>
