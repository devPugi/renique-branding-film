<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>르니크 브랜딩 영상</title>
<meta name="description" content="르니크 브랜딩 영상 기획안 및 스토리보드">
<link rel="icon" href="assets/logo/renique_monogram_ink.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://hangeul.pstatic.net/hangeul_static/css/maru-buri.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#F5EBE0;--sand:#F0DBC8;--line:#E6DACB;--ink:#14232B;--txt:#34464E;--slate:#5C6B72;--orange:#E86E26;
  --sans:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;--serif-en:'Cormorant Garamond',Georgia,serif;--serif-kr:'MaruBuri','Noto Serif KR',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:var(--sans);min-height:100svh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;word-break:keep-all}
main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:72px 40px 48px;display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.24em;color:var(--orange);text-transform:uppercase}
.logo{display:block;width:clamp(260px,56vw,520px);height:auto;margin-top:28px}
.sub{font-family:var(--serif-en);font-style:italic;color:var(--txt);font-size:clamp(17px,2.2vw,22px);margin-top:24px}
.sub b{font-family:var(--serif-kr);font-style:normal;font-weight:400}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:56px}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--line);overflow:hidden;transition:transform .25s,box-shadow .25s}
a.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,35,43,.12)}
.card .img{aspect-ratio:16/9;background-size:cover;background-position:center}
.card .img.field{background:var(--orange);display:flex;align-items:center;justify-content:center}
.card .img.field img{width:48%;height:auto}
.card .body{padding:22px 24px 24px}
.card .k{font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--orange)}
.card h2{font-family:var(--serif-kr);font-weight:400;font-size:22px;margin:6px 0 6px}
.card p{font-size:14px;color:var(--txt);line-height:1.6}
.card .go{margin-top:14px;font-size:13px;color:var(--ink);font-weight:600}
footer{text-align:center;padding:28px 16px;font-size:12px;letter-spacing:.06em;color:var(--slate)}
@media(max-width:640px){main{padding:48px 16px 32px}.cards{grid-template-columns:1fr;gap:16px;margin-top:40px}.card .body{padding:18px}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Branding Film · Brand Guideline v1.1</div>
  <img class="logo" src="assets/logo/renique_signature_ink.png" alt="RE;NIQUE CLINIC" width="1400" height="371">
  <div class="sub">Renouveau Unique — <b>다시, 나다운 특별함으로.</b></div>
  <div class="cards">
    <a class="card" href="르니크한의원_브랜딩영상_기획안.html">
      <div class="img field"><img src="assets/logo/renique_signature_white.png" alt=""></div>
      <div class="body"><div class="k">01 · PLANNING</div><h2>브랜딩 영상 기획안</h2><p>확정 사항과 가이드북 반영, 크리에이티브 콘셉트, 영상 구성, 톤앤매너, 제작 라인업과 일정</p><div class="go">기획안 보기 →</div></div>
    </a>
    <a class="card" href="르니크한의원_브랜딩영상_스토리보드.html">
      <div class="img" style="background-image:url('스토리보드%20사진/MAIN_CUT_02_16x9.jpg')"></div>
      <div class="body"><div class="k">02 · STORYBOARD</div><h2>브랜딩 영상 스토리보드</h2><p>메인 필름 60″ 14컷, 카테고리 숏폼 15″ × 3, 컷다운·루프 편집 구성</p><div class="go">스토리보드 보기 →</div></div>
    </a>
  </div>
</main>
<footer>르니크 강남 · RE;NIQUE CLINIC</footer>
</body>
</html>
